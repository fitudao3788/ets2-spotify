[supervisord]
nodaemon=true
user=root
loglevel=warn
logfile=/dev/stdout
logfile_maxbytes=0

[program:dbus]
command=dbus-daemon --system --nofork
priority=1
autostart=true

[program:pulseaudio]
command=pulseaudio --system --disallow-module-loading --disallow-exit --exit-idle-time=-1 --disable-shm --load="module-native-protocol-tcp auth-anonymous=1"
priority=10
autostart=true

[program:librespot]
command=librespot --config_dir /app/config
priority=40
autostart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:icecast]
command=icecast2 -c /etc/icecast2/icecast.xml
priority=20
autostart=true

[program:darkice]
command=bash -c "sleep 5 && darkice -c /etc/darkice.cfg"
priority=30
autostart=true

[program:server]
command=uv run /app/web/main.py
directory = /app/web
priority=50
autostart=true
